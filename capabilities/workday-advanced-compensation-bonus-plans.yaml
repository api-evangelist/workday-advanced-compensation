naftiko: 1.0.0-alpha2
info:
  label: Workday Advanced Compensation API — Bonus Plans
  description: 'Workday Advanced Compensation API — Bonus Plans. 1 operations. Lead operation: Workday List Bonus Plans. Self-contained
    Naftiko capability covering one Workday Advanced Compensation business surface.'
  tags:
  - Workday Advanced Compensation
  - Bonus Plans
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WORKDAY_ADVANCED_COMPENSATION_API_KEY: WORKDAY_ADVANCED_COMPENSATION_API_KEY
capability:
  consumes:
  - type: http
    namespace: workday-advanced-compensation-bonus-plans
    baseUri: https://{tenant}.workday.com/api/compensation/v1
    description: Workday Advanced Compensation API — Bonus Plans business capability. Self-contained, no shared references.
    resources:
    - name: bonusPlans
      path: /bonusPlans
      operations:
      - name: listbonusplans
        method: GET
        description: Workday List Bonus Plans
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limit
          in: query
          type: integer
          description: Maximum number of records to return
        - name: offset
          in: query
          type: integer
          description: Number of records to skip
    authentication:
      type: bearer
      token: '{{env.WORKDAY_ADVANCED_COMPENSATION_API_KEY}}'
  exposes:
  - type: rest
    namespace: workday-advanced-compensation-bonus-plans-rest
    port: 8080
    description: REST adapter for Workday Advanced Compensation API — Bonus Plans. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/bonusplans
      name: bonusplans
      description: REST surface for bonusPlans.
      operations:
      - method: GET
        name: listbonusplans
        description: Workday List Bonus Plans
        call: workday-advanced-compensation-bonus-plans.listbonusplans
        with:
          limit: rest.limit
          offset: rest.offset
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: workday-advanced-compensation-bonus-plans-mcp
    port: 9090
    transport: http
    description: MCP adapter for Workday Advanced Compensation API — Bonus Plans. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: workday-list-bonus-plans
      description: Workday List Bonus Plans
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: workday-advanced-compensation-bonus-plans.listbonusplans
      with:
        limit: tools.limit
        offset: tools.offset
      outputParameters:
      - type: object
        mapping: $.
