naftiko: 1.0.0-alpha2
info:
  label: Workday Advanced Compensation API — Compensation Grades
  description: 'Workday Advanced Compensation API — Compensation Grades. 2 operations. Lead operation: Workday List Compensation
    Grades. Self-contained Naftiko capability covering one Workday Advanced Compensation business surface.'
  tags:
  - Workday Advanced Compensation
  - Compensation Grades
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WORKDAY_ADVANCED_COMPENSATION_API_KEY: WORKDAY_ADVANCED_COMPENSATION_API_KEY
capability:
  consumes:
  - type: http
    namespace: workday-advanced-compensation-compensation-grades
    baseUri: https://{tenant}.workday.com/api/compensation/v1
    description: Workday Advanced Compensation API — Compensation Grades business capability. Self-contained, no shared references.
    resources:
    - name: compensationGrades
      path: /compensationGrades
      operations:
      - name: listcompensationgrades
        method: GET
        description: Workday List Compensation Grades
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limit
          in: query
          type: integer
          description: Maximum number of records to return
        - name: offset
          in: query
          type: integer
          description: Number of records to skip
    - name: compensationGrades-gradeId
      path: /compensationGrades/{gradeId}
      operations:
      - name: getcompensationgrade
        method: GET
        description: Workday Get Compensation Grade
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: gradeId
          in: path
          type: string
          description: Unique identifier for the compensation grade
          required: true
    authentication:
      type: bearer
      token: '{{env.WORKDAY_ADVANCED_COMPENSATION_API_KEY}}'
  exposes:
  - type: rest
    namespace: workday-advanced-compensation-compensation-grades-rest
    port: 8080
    description: REST adapter for Workday Advanced Compensation API — Compensation Grades. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/compensationgrades
      name: compensationgrades
      description: REST surface for compensationGrades.
      operations:
      - method: GET
        name: listcompensationgrades
        description: Workday List Compensation Grades
        call: workday-advanced-compensation-compensation-grades.listcompensationgrades
        with:
          limit: rest.limit
          offset: rest.offset
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/compensationgrades/{gradeid}
      name: compensationgrades-gradeid
      description: REST surface for compensationGrades-gradeId.
      operations:
      - method: GET
        name: getcompensationgrade
        description: Workday Get Compensation Grade
        call: workday-advanced-compensation-compensation-grades.getcompensationgrade
        with:
          gradeId: rest.gradeId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: workday-advanced-compensation-compensation-grades-mcp
    port: 9090
    transport: http
    description: MCP adapter for Workday Advanced Compensation API — Compensation Grades. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: workday-list-compensation-grades
      description: Workday List Compensation Grades
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: workday-advanced-compensation-compensation-grades.listcompensationgrades
      with:
        limit: tools.limit
        offset: tools.offset
      outputParameters:
      - type: object
        mapping: $.
    - name: workday-get-compensation-grade
      description: Workday Get Compensation Grade
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: workday-advanced-compensation-compensation-grades.getcompensationgrade
      with:
        gradeId: tools.gradeId
      outputParameters:
      - type: object
        mapping: $.
