naftiko: 1.0.0-alpha2
info:
  label: Workday Advanced Compensation API — Compensation Budgets
  description: 'Workday Advanced Compensation API — Compensation Budgets. 1 operations. Lead operation: Workday List Compensation
    Budgets. Self-contained Naftiko capability covering one Workday Advanced Compensation business surface.'
  tags:
  - Workday Advanced Compensation
  - Compensation Budgets
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WORKDAY_ADVANCED_COMPENSATION_API_KEY: WORKDAY_ADVANCED_COMPENSATION_API_KEY
capability:
  consumes:
  - type: http
    namespace: workday-advanced-compensation-compensation-budgets
    baseUri: https://{tenant}.workday.com/api/compensation/v1
    description: Workday Advanced Compensation API — Compensation Budgets business capability. Self-contained, no shared references.
    resources:
    - name: compensationBudgets
      path: /compensationBudgets
      operations:
      - name: listcompensationbudgets
        method: GET
        description: Workday List Compensation Budgets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limit
          in: query
          type: integer
          description: Maximum number of records to return
        - name: offset
          in: query
          type: integer
          description: Number of records to skip
        - name: year
          in: query
          type: integer
          description: Filter by budget year
    authentication:
      type: bearer
      token: '{{env.WORKDAY_ADVANCED_COMPENSATION_API_KEY}}'
  exposes:
  - type: rest
    namespace: workday-advanced-compensation-compensation-budgets-rest
    port: 8080
    description: REST adapter for Workday Advanced Compensation API — Compensation Budgets. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/compensationbudgets
      name: compensationbudgets
      description: REST surface for compensationBudgets.
      operations:
      - method: GET
        name: listcompensationbudgets
        description: Workday List Compensation Budgets
        call: workday-advanced-compensation-compensation-budgets.listcompensationbudgets
        with:
          limit: rest.limit
          offset: rest.offset
          year: rest.year
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: workday-advanced-compensation-compensation-budgets-mcp
    port: 9090
    transport: http
    description: MCP adapter for Workday Advanced Compensation API — Compensation Budgets. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: workday-list-compensation-budgets
      description: Workday List Compensation Budgets
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: workday-advanced-compensation-compensation-budgets.listcompensationbudgets
      with:
        limit: tools.limit
        offset: tools.offset
        year: tools.year
      outputParameters:
      - type: object
        mapping: $.
