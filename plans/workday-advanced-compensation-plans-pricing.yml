description: >-
  Workday publishes NO plans, tiers, list prices or quotas for Advanced Compensation or for the
  APIs that serve it. Advanced Compensation is an add-on module to a Workday HCM subscription,
  sold through enterprise sales; API access is included with the tenant subscription rather than
  metered or priced separately, and there is no self-serve signup or public price card. This file
  REPLACES a 2026-05-04 scaffold that invented a Free / Pro / Enterprise ladder with per-request
  prices, none of which Workday has ever published.
