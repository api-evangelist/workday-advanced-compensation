- aid: workday-advanced-compensation:workday-compensation-soap-wws
  name: Workday Compensation SOAP Web Services (WWS v47.0)
  description: Workday Web Services for compensation, published as WSDL 1.1 on community.workday.com under the urn:com.workday/bsvc/Compensation namespace. The Compensation service carries 68 operations — compensation plans, grades and grade hierarchies, matrices, eligibility rules, merit adjustments, bonus payments, stock grants, severance worksheets, period activity pay — and Compensation_Review carries a further 21 covering review templates, participation rule sets, budget pools, employee awards and deferred bonus calculation. This is where the Advanced Compensation capability set actually lives.
